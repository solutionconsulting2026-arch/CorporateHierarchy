<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Muscat Trading LLC – Relationship Map</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #F6FAFD;
  --card: #FFFFFF;
  --card-line: #CFE3F1;
  --ink: #172033;
  --muted: #6B7A90;
  --brand: #4F91C6;
  --brand-soft: #E8F4FC;
  --hub: #5E9FD1;
  --hub-deep: #3F7FB3;
  --link: #A9CFE7;
  --shadow: rgba(79,145,198,0.14);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: "Poppins","Segoe UI",system-ui,sans-serif;
  background: var(--bg);
  overflow: hidden;
}

.canvas {
  width: 100%;
  height: 100%;
  overflow: auto;
}

svg {
  width: 100%;
  height: auto;
  min-width: 720px;
  display: block;
}

/* ---------- Cards ---------- */

.card {
  fill: var(--card);
  stroke: var(--card-line);
  stroke-width: 1.5;
  filter: drop-shadow(0 5px 10px var(--shadow));
}

.hub {
  fill: var(--hub);
  stroke: var(--hub-deep);
  stroke-width: 2;
  filter: drop-shadow(0 8px 18px var(--shadow));
}

.avatar {
  fill: var(--brand-soft);
  stroke: var(--card-line);
}

.initials {
  fill: var(--brand);
  font-size: 11px;
  font-weight: 600;
  text-anchor: middle;
}

.glyph {
  fill: none;
  stroke: var(--brand);
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.glyph-hub {
  fill: none;
  stroke: #FFFFFF;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.name {
  fill: var(--ink);
  font-size: 13px;
  font-weight: 600;
}

.role {
  fill: var(--muted);
  font-size: 10px;
}

.hub-title {
  fill: #FFFFFF;
  font-size: 17px;
  font-weight: 700;
  text-anchor: middle;
}

.hub-sub {
  fill: rgba(255,255,255,0.88);
  font-size: 10px;
  text-anchor: middle;
}

/* ---------- Connectors ---------- */

.edge {
  fill: none;
  stroke: var(--link);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
</style>
</head>
