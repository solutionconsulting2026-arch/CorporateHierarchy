<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bajaj Group – Corporate Hierarchy</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --parent: #6EAAD7;
    --sub: #9FCBE7;
    --line: #6EAAD7;
    --line-soft: #9FCBE7;
    --child-bg: #F6FBFD;
    --text: #000;
    --shadow: 0 8px 22px rgba(110, 170, 215, 0.18);
    --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #fff; font-family: var(--font); color: var(--text); }
  #canvas {
    position: relative; height: 100vh; overflow: auto;
    background: linear-gradient(180deg, #fff 0%, #f7fbff 100%);
  }
  svg { display: block; margin: 0 auto; }

  .node { cursor: pointer; }
  .node rect { transition: filter .15s ease, transform .15s ease; }
  .node:hover rect { filter: drop-shadow(0 10px 18px rgba(110,170,215,.35)); }

  .parent rect { fill: var(--parent); }
  .parent .t1 { fill: #fff; font-size: 22px; font-weight: 600; text-anchor: middle; }
  .parent .t2 { fill: #fff; font-size: 15px; text-anchor: middle; opacity: .95; }

  .subsidiary rect { fill: var(--sub); }
  .subsidiary .t1 { fill: #000; font-size: 17px; font-weight: 600; text-anchor: middle; }
  .subsidiary .t2 { fill: #000; font-size: 14px; text-anchor: middle; opacity: .85; }

  .child rect { fill: var(--child-bg); stroke: var(--line); stroke-width: 2; }
  .child .t1 { fill: var(--parent); font-size: 14.5px; font-weight: 600; }
  .child .t2 { fill: #000; font-size: 13.5px; opacity: .9; }

  .conn { fill: none; stroke: var(--line); stroke-width: 2; }
  .conn.soft { stroke: var(--line-soft); }

  .tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 10;
    background: #fff; border-radius: 8px; padding: 10px 12px; max-width: 320px;
    box-shadow: var(--shadow); border: 1px solid rgba(110,170,215,.25); font-size: 13px;
  }
  .tooltip h4 { margin: 0 0 4px; font-size: 14px; }
  .tooltip p { margin: 0; line-height: 1.35; opacity: .8; }

  .panel {
    position: fixed; top: 16px; right: 16px; width: 360px; max-width: calc(100% - 32px);
    max-height: calc(100% - 32px); overflow: auto; display: none; z-index: 20;
    background: #fff; border-radius: 12px; padding: 18px; box-sizing: border-box;
    box-shadow: var(--shadow); border: 1px solid rgba(110,170,215,.25);
  }
  .panel h3 { margin: 0 0 2px; font-size: 18px; }
  .panel .type { font-size: 12px; color: var(--parent); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .panel .close { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 18px; cursor: pointer; }
  .panel .row { margin-top: 12px; font-size: 13.5px; }
  .panel .row b { display: block; font-size: 12px; color: #555; margin-bottom: 3px; font-weight: 600; }
  .panel a { color: var(--parent); text-decoration: none; }
  .panel a:hover { text-decoration: underline; }
  .panel ul { margin: 4px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<div id="canvas">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#6EAAD7" />
      </marker>
    </defs>
    <g id="conns"></g>
    <g id="nodes"></g>
  </svg>
</div>
<div id="tooltip" class="tooltip"></div>
<div id="panel" class="panel">
  <button class="close" aria-label="Close" onclick="closePanel()">✕</button>
  <div id="panelBody"></div>
</div>

<script>
/* ---------------------------------------------------------------
   DATA – edit here. Children types: Supplier | Account | Holding | Dealer
---------------------------------------------------------------- */
const DATA = {
  parent: {
    name: "Bajaj Group",
    type: "Parent",
    link: "",
    shareholders: "Bajaj Family & Public Shareholders",
    financials: "FY24 Revenue: ₹1.2 Lakh Crore | Employees: 40,000+"
  },
  subsidiaries: [
    {
      name: "Bajaj Auto",
      type: "Subsidiary",
      link: "",
      shareholders: "Bajaj Holdings (31.5%), Public & Institutional (68.5%)",
      financials: "FY24 Revenue: ₹42,000 Crore | Net Profit: ₹7,200 Crore",
      stakeholders: [
        { name: "Mr. Rajiv Bajaj", role: "Managing Director", link: "" },
        { name: "Mr. Rakesh Sharma", role: "Executive Director", link: "" }
      ],
      children: [
        { name: "Bosch India", type: "Supplier", desc: "Auto components & fuel systems", link: "" },
        { name: "HDFC Bank", type: "Account", desc: "Primary banking & treasury operations", link: "" },
        { name: "KTM AG Partnership", type: "Holding", desc: "Strategic alliance for premium motorcycles", link: "" }
      ]
    },
    {
      name: "Bajaj Finserv",
      type: "Subsidiary",
      link: "",
      shareholders: "Bajaj Holdings (39%), Public Shareholders (61%)",
      financials: "FY24 Revenue: ₹1.1 Lakh Crore (consolidated)",
      stakeholders: [
        { name: "Mr. Sanjiv Bajaj", role: "Chairman & Managing Director", link: "" }
      ],
      children: [
        { name: "Bajaj Finance", type: "Holding", desc: "Consumer, SME & commercial lending NBFC", link: "" },
        { name: "Bajaj General Insurance", type: "Holding", desc: "General insurance", link: "" },
        { name: "Bajaj Life Insurance", type: "Holding", desc: "Life insurance & protection", link: "" }
      ]
    },
    {
      name: "Bajaj Electricals",
      type: "Subsidiary",
      link: "",
      shareholders: "Promoter Group & Public Shareholders",
      financials: "FY24 Revenue: ₹4,600 Crore",
      stakeholders: [
        { name: "Mr. Shekhar Bajaj", role: "Chairman", link: "" }
      ],
      children: [
        { name: "Consumer Products Division", type: "Holding", desc: "Appliances, fans & lighting", link: "" }
      ]
    }
  ]
};

/* ---------------------------------------------------------------
   LAYOUT – PETRONAS style
---------------------------------------------------------------- */
const L = {
  pad: 60,
  parent: { w: 410, h: 118, y: 40 },
  busGap: 38,              // parent bottom → horizontal bus
  sub: { w: 340, h: 104 },
  subGap: 70,              // horizontal gap between subsidiaries
  trunkDrop: 42,           // subsidiary bottom → trunk elbow
  trunkInset: 4,           // trunk x offset from subsidiary left edge
  child: { w: 290, h: 76, gap: 30, indent: 45, firstGap: 42 }
};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const gConn = document.getElementById("conns");
const gNodes = document.getElementById("nodes");

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function path(points, cls, arrow) {
  const d = points.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
  const p = el("path", { d, class: "conn " + (cls || "") }, gConn);
  if (arrow) p.setAttribute("marker-end", "url(#arrow)");
}

function drawNode(n, kind, data) {
  const g = el("g", { class: "node " + kind, tabindex: 0 }, gNodes);
  const r = kind === "child" ? 10 : 14;
  el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: r, ry: r }, g);

  if (kind === "child") {
    const tx = n.x + 18;
    el("text", { x: tx, y: n.y + 32, class: "t1" }, g).textContent = data.name;
    el("text", { x: tx, y: n.y + 56, class: "t2" }, g).textContent = data.type;
  } else {
    const cx = n.x + n.w / 2;
    const big = kind === "parent";
    el("text", { x: cx, y: n.y + n.h / 2 - (big ? 4 : 2), class: "t1" }, g).textContent = data.name;
    el("text", { x: cx, y: n.y + n.h / 2 + (big ? 26 : 26), class: "t2" }, g).textContent = data.type;
  }

  g.addEventListener("mousemove", e => showTip(e, data));
  g.addEventListener("mouseleave", hideTip);
  g.addEventListener("click", () => openPanel(data));
  g.addEventListener("keydown", e => { if (e.key === "Enter") openPanel(data); });
}

function render() {
  gConn.innerHTML = ""; gNodes.innerHTML = "";
  const subs = DATA.subsidiaries;
  const n = subs.length;
  const rowW = n * L.sub.w + (n - 1) * L.subGap;
  const W = Math.max(rowW, L.parent.w) + L.pad * 2;
  const cx = W / 2;

  const parent = { x: cx - L.parent.w / 2, y: L.parent.y, w: L.parent.w, h: L.parent.h };
  const busY = parent.y + parent.h + L.busGap;
  const subY = busY + 38;
  const startX = (W - rowW) / 2;

  let maxBottom = subY + L.sub.h;

  // Parent → bus → subsidiaries
  const subNodes = subs.map((s, i) => ({ x: startX + i * (L.sub.w + L.subGap), y: subY, w: L.sub.w, h: L.sub.h, data: s }));
  const firstC = subNodes[0].x + L.sub.w / 2;
  const lastC = subNodes[n - 1].x + L.sub.w / 2;
  path([[cx, parent.y + parent.h], [cx, busY]]);
  if (n > 1) path([[firstC, busY], [lastC, busY]]);
  subNodes.forEach(s => path([[s.x + s.w / 2, busY], [s.x + s.w / 2, s.y - 1]], "", true));

  // Subsidiary → trunk → children
  subNodes.forEach(s => {
    const kids = s.data.children || [];
    if (!kids.length) return;
    const sc = s.x + s.w / 2;
    const elbowY = s.y + s.h + L.trunkDrop;
    const trunkX = s.x + L.trunkInset;
    const childX = s.x + L.child.indent;

    const kidNodes = kids.map((k, j) => ({
      x: childX,
      y: elbowY + L.child.firstGap + j * (L.child.h + L.child.gap),
      w: L.child.w, h: L.child.h, data: k
    }));
    const lastMid = kidNodes[kidNodes.length - 1].y + L.child.h / 2;

    path([[sc, s.y + s.h], [sc, elbowY], [trunkX, elbowY], [trunkX, lastMid]], "soft");
    kidNodes.forEach(k => {
      const my = k.y + k.h / 2;
      path([[trunkX, my], [k.x - 1, my]], "", true);
      drawNode(k, "child", k.data);
      maxBottom = Math.max(maxBottom, k.y + k.h);
    });
  });

  drawNode(parent, "parent", DATA.parent);
  subNodes.forEach(s => drawNode(s, "subsidiary", s.data));

  const H = maxBottom + L.pad;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
}

/* ---------------------------------------------------------------
   Tooltip & detail panel
---------------------------------------------------------------- */
const tip = document.getElementById("tooltip");
function showTip(e, d) {
  const sub = d.desc || d.financials || d.shareholders || "";
  tip.innerHTML = `<h4>${d.name}</h4><p>${d.type}${sub ? " · " + sub : ""}</p>`;
  tip.style.display = "block";
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 10);
  tip.style.left = x + "px";
  tip.style.top = (e.clientY + 14) + "px";
}
function hideTip() { tip.style.display = "none"; }

function link(name, url) {
  return url ? `<a href="${url}" target="_blank" rel="noopener">${name}</a>` : name;
}

function openPanel(d) {
  let h = `<div class="type">${d.type}</div><h3>${link(d.name, d.link)}</h3>`;
  if (d.desc) h += `<div class="row"><b>Relationship</b>${d.desc}</div>`;
  if (d.shareholders) h += `<div class="row"><b>Shareholders</b>${d.shareholders}</div>`;
  if (d.financials) h += `<div class="row"><b>Financials</b>${d.financials}</div>`;
  if (d.stakeholders && d.stakeholders.length) {
    h += `<div class="row"><b>Key Stakeholders</b><ul>` +
      d.stakeholders.map(s => `<li>${link(s.name, s.link)} — ${s.role}</li>`).join("") + `</ul></div>`;
  }
  if (d.children && d.children.length) {
    h += `<div class="row"><b>Linked Entities</b><ul>` +
      d.children.map(c => `<li>${link(c.name, c.link)} <span style="opacity:.6">(${c.type})</span></li>`).join("") + `</ul></div>`;
  }
  document.getElementById("panelBody").innerHTML = h;
  document.getElementById("panel").style.display = "block";
  hideTip();
}
function closePanel() { document.getElementById("panel").style.display = "none"; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

render();
</script>
</body>
</html>
